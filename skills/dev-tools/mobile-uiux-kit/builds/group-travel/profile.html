<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <div class="profile-header">
      <img class="avatar-lg" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&q=80" alt="头像">
      <div class="profile-info">
        <h2 class="text-lg font-bold text-main">林 · 野径</h2>
        <p class="text-xs text-sub">ID: BT20250730</p>
      </div>
    </div>

    <div class="glass-card profile-stats">
      <div class="stat-col"><p class="stat-num">4</p><p class="stat-label">我的结伴</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">9</p><p class="stat-label">收藏目的地</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">1260</p><p class="stat-label">旅居积分</p></div>
    </div>

    <div class="glass-card mt-4 overflow-hidden">
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-route setting-icon" style="background:#1fb57a;"></i>
        <span class="flex-1">我的结伴</span>
        <span class="text-xs mr-2 text-sub">4 场</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-bullhorn setting-icon" style="background:#1fb57a;"></i>
        <span class="flex-1">我发起的</span>
        <span class="text-xs mr-2 text-sub">2 场</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-bookmark setting-icon" style="background:#2ec8e6;color:#06424b;"></i>
        <span class="flex-1">收藏目的地</span>
        <span class="text-xs mr-2 text-primary">9 个</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-wallet setting-icon" style="background:#7b5bff;"></i>
        <span class="flex-1">旅行钱包</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-shield-halved setting-icon" style="background:#8b93b0;"></i>
        <span class="flex-1">实名认证</span>
        <span class="text-xs mr-2 text-sub">已认证</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-gear setting-icon" style="background:#8b93b0;"></i>
        <span class="flex-1">账户设置</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="setting-item ripple-btn" id="helpCenterBtn">
        <i class="fa-solid fa-circle-question setting-icon" style="background:#5856d6;"></i>
        <span class="flex-1">帮助中心</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn ripple-btn">退出登录</button>

    <div class="text-center mt-4">
      <span id="authLink" class="text-xs text-sub" style="cursor:pointer;">帮助？@Auth 江枫</span>
    </div>
  </main>

  <script src="./shared/common/qrcode-data.js"></script>
  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
    bindLogout();

    document.getElementById('helpCenterBtn').addEventListener('click', openQrcodeModal);
    document.getElementById('authLink').addEventListener('click', openQrcodeModal);
  </script>
</body>
</html>
