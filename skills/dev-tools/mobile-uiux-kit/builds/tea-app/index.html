<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茗品 · 原型容器</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="shell-body">
  <div class="phone-shell">
    <div class="dynamic-island"></div>

    <iframe id="appFrame" class="app-frame" src="./home.html" title="App Page"></iframe>

    <nav class="tab-bar" id="tabBar">
      <button class="tab-item active" data-page="home.html">
        <i class="fa-solid fa-mug-hot"></i>
        <span>茶室</span>
      </button>
      <button class="tab-item" data-page="discover.html">
        <i class="fa-solid fa-book-open"></i>
        <span>茶话</span>
      </button>
      <button class="tab-item" data-page="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <script src="./shared/common/app.js"></script>
  <script>
    initTabNavigation();

    window.addEventListener('message', function (e) {
      const appFrame = document.getElementById('appFrame');
      const tabItems = document.querySelectorAll('.tab-item');
      if (e.data.action === 'login-success') {
        switchPage(appFrame, 'home.html');
        setActiveTab(tabItems, document.querySelector('.tab-item[data-page="home.html"]'));
      } else if (e.data.action === 'logout') {
        switchPage(appFrame, 'login.html');
        setActiveTab(tabItems, document.querySelector('.tab-item[data-page="home.html"]'));
      }
    });
  </script>
</body>
</html>
