<!DOCTYPE html>

  <title>茶话</title>

</head>
<body class="page-body">

  </header>

  <main class="page-content px-5 pb-6">

        <input type="text" class="search-input" placeholder="搜索茶文、茶友、茶事">

    </div>

    <div class="waterfall">

        </div>
      </div>

          <p class="wf-title">走进云南古茶山</p>

        <img src="https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=400&q=80" alt="茶会">

          <p class="wf-title">周末城市茶会招募中</p>
          <p class="wf-desc">线下品茗 · 以茶会友</p>

        <img src="https://images.unsplash.com/photo-1563822249366-3efb23b8e0c9?w=400&q=80" alt="茶道">
        <div class="wf-info">
          <p class="wf-title">新手茶道入门 30 天</p>
          <p class="wf-desc">从识茶到懂茶</p>

      </div>
