<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茶室</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <div class="flex items-center justify-between pt-3 pb-4">
      <div>
        <p class="text-xs" style="color:#8a8278;">午后好时光</p>
        <h1 class="text-xl font-bold" style="color:#2d2a26;">今日宜品一盏春茶</h1>
      </div>
      <img class="avatar-sm" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80" alt="头像">
    </div>

    <div class="search-bar-wrapper" style="padding-top:0;">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" placeholder="搜索茶品、茶知识">
      </div>
    </div>

    <div class="grid grid-cols-4 gap-3 mt-2">
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#f0f4e8,#dce9c8);">
          <i class="fa-solid fa-leaf" style="color:#7a9a3c;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">绿茶</span>
      </div>
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#fdf1e8,#f7e0cc);">
          <i class="fa-solid fa-mug-hot" style="color:#b8763e;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">红茶</span>
      </div>
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#f0eef7,#ddd8ee);">
          <i class="fa-solid fa-spa" style="color:#8a7bc4;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">乌龙</span>
      </div>
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#f2ead8,#e8dcc0);">
          <i class="fa-solid fa-circle-half-stroke" style="color:#a08b4f;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">普洱</span>
      </div>
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#f5f3ef,#e9e5dc);">
          <i class="fa-solid fa-feather" style="color:#9a948a;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">白茶</span>
      </div>
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#fdeef0,#f8d8de);">
          <i class="fa-solid fa-flower" style="color:#d47d92;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">花茶</span>
      </div>
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#eef3f2,#d9e6e4);">
          <i class="fa-solid fa-droplet" style="color:#4c9a8f;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">黄茶</span>
      </div>
      <div class="flex flex-col items-center gap-1 ripple-btn" style="cursor:pointer;">
        <div class="cat-circle" style="background:linear-gradient(135deg,#f3eee8,#e6dbd0);">
          <i class="fa-solid fa-layer-group" style="color:#8c6f52;font-size:18px;"></i>
        </div>
        <span class="text-xs" style="color:#2d2a26;">黑茶</span>
      </div>
    </div>

    <div class="banner-card ripple-btn mt-4">
      <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=600&q=80" alt="品茶">
      <div class="banner-overlay">
        <h2 class="text-lg font-bold text-white">今日推荐 · 明前龙井</h2>
        <p class="text-xs text-white/80">鲜爽回甘 · 春日限定</p>
      </div>
    </div>

    <div class="brew-card ripple-btn mt-4">
      <div class="brew-icon">
        <i class="fa-solid fa-stopwatch"></i>
      </div>
      <div class="flex-1">
        <p class="text-sm font-semibold" style="color:#2d2a26;">泡茶计时器</p>
        <p class="text-xs mt-0.5" style="color:#8a8278;">绿茶水温 85℃ · 3 分钟出汤</p>
      </div>
      <span class="chip">开始</span>
    </div>

    <div class="flex items-center justify-between mt-5 mb-3">
      <h3 class="section-title" style="margin-bottom:0;">时令茶品</h3>
      <span class="text-xs" style="color:#7a9a3c;cursor:pointer;">查看全部 <i class="fa-solid fa-chevron-right"></i></span>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="tea-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400&q=80" alt="龙井">
        <div class="tea-card-info">
          <p class="tea-card-name">西湖龙井</p>
          <p class="tea-card-meta">绿茶 · 产地杭州</p>
        </div>
      </div>
      <div class="tea-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400&q=80" alt="铁观音">
        <div class="tea-card-info">
          <p class="tea-card-name">安溪铁观音</p>
          <p class="tea-card-meta">乌龙 · 兰香馥郁</p>
        </div>
      </div>
      <div class="tea-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?w=400&q=80" alt="普洱茶">
        <div class="tea-card-info">
          <p class="tea-card-name">陈年普洱</p>
          <p class="tea-card-meta">黑茶 · 醇厚顺滑</p>
        </div>
      </div>
      <div class="tea-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1597318181409-cf64d0b5d8a2?w=400&q=80" alt="白茶">
        <div class="tea-card-info">
          <p class="tea-card-name">白毫银针</p>
          <p class="tea-card-meta">白茶 · 清甜毫香</p>
        </div>
      </div>
    </div>

    <h3 class="section-title">品茶指南</h3>
    <div class="space-y-3">
      <div class="list-card ripple-btn">
        <img class="list-thumb" src="https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=200&q=80" alt="泡茶">
        <div class="flex-1">
          <p class="font-semibold text-sm" style="color:#2d2a26;">新手必学的泡茶水温</p>
          <div class="flex items-center gap-2 mt-1">
            <span class="chip">绿 85℃</span>
            <span class="chip">红 95℃</span>
            <span class="chip">乌 100℃</span>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="list-card ripple-btn">
        <img class="list-thumb" src="https://images.unsplash.com/photo-1563822249366-3efb23b8e0c9?w=200&q=80" alt="茶具">
        <div class="flex-1">
          <p class="font-semibold text-sm" style="color:#2d2a26;">茶具入门：盖碗与紫砂</p>
          <p class="text-xs mt-1" style="color:#8a8278;">适合不同茶类的冲泡器具</p>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
    </div>
  </main>

  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
  </script>
</body>
</html>
