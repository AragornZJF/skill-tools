<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <div class="profile-header">
      <img class="avatar-lg" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80" alt="头像">
      <div class="profile-info">
        <h2 class="text-lg font-bold" style="color:#1f3d36;">绿手指小园丁</h2>
        <div class="flex items-center gap-1 mt-1">
          <span class="chip">植龄 2 年</span>
        </div>
      </div>
    </div>

    <div class="glass-card profile-stats">
      <div class="stat-col"><p class="stat-num">8</p><p class="stat-label">我的植物</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">365</p><p class="stat-label">养护天数</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">96%</p><p class="stat-label">按时打卡</p></div>
    </div>

    <div class="glass-card mt-4 overflow-hidden">
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-seedling setting-icon" style="background:#38b2a0;"></i>
        <span class="flex-1">我的植物</span>
        <span class="text-xs mr-2" style="color:#7c9a93;">8 盆</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-calendar-check setting-icon" style="background:#c9a24b;"></i>
        <span class="flex-1">养护日历</span>
        <span class="text-xs mr-2" style="color:#7c9a93;">本周 4 项</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-camera setting-icon" style="background:#6d8dc9;"></i>
        <span class="flex-1">识别记录</span>
        <span class="text-xs mr-2" style="color:#7c9a93;">36 条</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-bell setting-icon" style="background:#d47d92;"></i>
        <span class="flex-1">养护提醒</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-gear setting-icon" style="background:#7c9a93;"></i>
        <span class="flex-1">账户设置</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn" id="helpCenterBtn">
        <i class="fa-solid fa-circle-question setting-icon" style="background:#5856d6;"></i>
        <span class="flex-1">帮助中心</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn ripple-btn">退出登录</button>

    <div class="text-center mt-4">
      <span id="authLink" class="text-xs" style="color:#7c9a93;cursor:pointer;">帮助？@Auth 江枫</span>
    </div>
  </main>

  <script src="./shared/common/qrcode-data.js"></script>
  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
    bindLogout();

    document.getElementById('helpCenterBtn').addEventListener('click', openQrcodeModal);
    document.getElementById('authLink').addEventListener('click', openQrcodeModal);
  </script>
</body>
</html>
