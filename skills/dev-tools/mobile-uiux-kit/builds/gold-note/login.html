<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 金记</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <!-- iOS 状态栏 -->
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content flex flex-col justify-center px-8">
    <div class="text-center mb-10 fade-up">
      <div class="app-logo">
        <i class="fa-solid fa-coins"></i>
      </div>
      <h1 class="text-2xl font-bold mt-4" style="color:#1d1d1f;">金记</h1>
      <p class="text-sm mt-1" style="color:#8b8d94;">每一笔，都清清楚楚</p>
    </div>

    <div class="glass-card p-6 space-y-4 fade-up delay-1">
      <div class="input-group">
        <i class="fa-solid fa-user input-icon"></i>
        <input type="text" id="username" placeholder="手机号 / 邮箱" class="glass-input">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="password" placeholder="密码" class="glass-input">
      </div>
      <button id="loginBtn" class="primary-btn ripple-btn w-full">登 录</button>
      <p class="text-center text-xs" style="color:#8b8d94;">还没有账户？<span class="link-accent">立即注册</span></p>
    </div>

    <div class="text-center mt-6 fade-up delay-2">
      <span id="authLink" class="text-xs" style="color:#8b8d94;cursor:pointer;">帮助？@Auth 江枫</span>
    </div>
  </main>

  <script src="./shared/common/qrcode-data.js"></script>
  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
    bindLogin();

    document.getElementById('authLink').addEventListener('click', openQrcodeModal);
  </script>
</body>
</html>
