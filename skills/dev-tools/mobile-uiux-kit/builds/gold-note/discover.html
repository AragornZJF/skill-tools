<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理财 · 金记</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <!-- iOS 状态栏 -->
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <div class="pt-3 pb-1 fade-up">
      <h1 class="text-xl font-bold" style="color:#22242b;">理财学院</h1>
      <p class="text-xs mt-0.5" style="color:#8b8d94;">学点有用的，让钱更会工作</p>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar-wrapper fade-up delay-1">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" placeholder="搜索理财知识、省钱攻略">
      </div>
    </div>

    <!-- 分类 chips -->
    <div class="chips-row fade-up delay-1">
      <button class="chip active">全部</button>
      <button class="chip">基金</button>
      <button class="chip">储蓄</button>
      <button class="chip">预算</button>
      <button class="chip">旅行</button>
      <button class="chip">职场</button>
    </div>

    <!-- 双列瀑布流 -->
    <div class="waterfall fade-up delay-2">
      <div class="wf-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=400&q=80" alt="基金定投">
        <div class="wf-info">
          <p class="wf-title">新手定投指南：每月 500 元怎么投</p>
          <p class="wf-desc">从零开始的基金定投入门</p>
          <p class="wf-meta"><i class="fa-regular fa-eye"></i>2.3w 阅读</p>
        </div>
      </div>
      <div class="wf-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?w=400&q=80" alt="52周存钱法">
        <div class="wf-info">
          <p class="wf-title">52 周存钱法，一年多存 1.3 万</p>
          <p class="wf-desc">打工人亲测有效的强制储蓄</p>
          <p class="wf-meta"><i class="fa-regular fa-eye"></i>1.8w 阅读</p>
        </div>
      </div>
      <div class="wf-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400&q=80" alt="咖啡省钱">
        <div class="wf-info">
          <p class="wf-title">每天一杯咖啡，一年花掉多少钱？</p>
          <p class="wf-desc">手冲代替外卖，月省 400+</p>
          <p class="wf-meta"><i class="fa-regular fa-eye"></i>6.5k 阅读</p>
        </div>
      </div>
      <div class="wf-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=400&q=80" alt="旅行预算">
        <div class="wf-info">
          <p class="wf-title">穷游不穷玩：5 千玩转川西环线</p>
          <p class="wf-desc">机票、住宿、门票预算拆解</p>
          <p class="wf-meta"><i class="fa-regular fa-eye"></i>9.2k 阅读</p>
        </div>
      </div>
      <div class="wf-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1518186285589-2f7649de83e0?w=400&q=80" alt="记账习惯">
        <div class="wf-info">
          <p class="wf-title">坚持记账 3 年，我总结出 5 条心得</p>
          <p class="wf-desc">让记账不再半途而废</p>
          <p class="wf-meta"><i class="fa-regular fa-eye"></i>3.1w 阅读</p>
        </div>
      </div>
      <div class="wf-card ripple-btn">
        <img src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400&q=80" alt="置业规划">
        <div class="wf-info">
          <p class="wf-title">首付怎么攒？年轻人置业时间表</p>
          <p class="wf-desc">30 岁前买房的分步规划</p>
          <p class="wf-meta"><i class="fa-regular fa-eye"></i>1.2w 阅读</p>
        </div>
      </div>
    </div>
  </main>

  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();

    /* 分类 chips 切换高亮 */
    document.querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
      });
    });
  </script>
</body>
</html>
