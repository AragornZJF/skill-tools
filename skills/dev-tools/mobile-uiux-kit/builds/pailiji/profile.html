<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拍立记 · 我的</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <!-- 个人头部 -->
    <div class="profile-header">
      <img class="avatar-lg" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80" alt="头像">
      <div class="profile-info">
        <h2 class="text-lg font-bold" style="color:#1d1d1f;">林小满</h2>
        <p class="text-xs" style="color:#86868b;">拍立记号: PLJ2026</p>
        <p class="text-xs mt-1" style="color:#86868b;">「在快节奏里，留一帧慢的。」</p>
      </div>
    </div>

    <!-- 统计 -->
    <div class="glass-card profile-stats">
      <div class="stat-col"><p class="stat-num">128</p><p class="stat-label">记录天数</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">42</p><p class="stat-label">照片张数</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">8</p><p class="stat-label">已用模板</p></div>
    </div>

    <!-- 记录热力图 -->
    <div class="glass-card heatmap-card">
      <div class="heatmap-head">
        <span class="heatmap-title">记录热力图</span>
        <span class="heatmap-streak">连续 12 天</span>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heatmap-legend">
        <span>少</span>
        <span class="hm-cell"></span>
        <span class="hm-cell l1"></span>
        <span class="hm-cell l2"></span>
        <span class="hm-cell l3"></span>
        <span class="hm-cell l4"></span>
        <span>多</span>
      </div>
    </div>

    <!-- 设置列表 -->
    <div class="glass-card mt-4 overflow-hidden">
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-table-cells-large setting-icon" style="background:#007aff;"></i>
        <span class="flex-1">我的模板</span>
        <span class="text-xs" style="color:#86868b;">8 款</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;margin-left:6px;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-bookmark setting-icon" style="background:#ff9500;"></i>
        <span class="flex-1">收藏的灵感</span>
        <span class="text-xs" style="color:#86868b;">36 条</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;margin-left:6px;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-bell setting-icon" style="background:#ff3b30;"></i>
        <span class="flex-1">提醒设置</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn" id="helpCenterBtn">
        <i class="fa-solid fa-circle-question setting-icon" style="background:#5856d6;"></i>
        <span class="flex-1">帮助中心</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-circle-info setting-icon" style="background:#34c759;"></i>
        <span class="flex-1">关于拍立记</span>
        <span class="text-xs" style="color:#86868b;">v1.0</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;margin-left:6px;"></i>
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn ripple-btn">退出登录</button>

    <div class="text-center mt-4">
      <span id="authLink" class="text-xs" style="color:#86868b;cursor:pointer;">帮助？@Auth 江枫</span>
    </div>
  </main>

  <script src="./shared/common/qrcode-data.js"></script>
  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
    bindLogout();

    /* 记录热力图：13 列 × 7 行，按"越近越密"的真实感渲染 */
    (function () {
      var grid = document.getElementById('heatmap');
      /* 一个固定的拟真强度序列（0=无，1-4=记录密度），近期偏密 */
      var seed = [
        0,1,0,2,0,0,1,2,0,1,0,2,3,
        1,0,2,3,1,0,2,0,3,1,2,0,4,
        0,2,1,0,3,2,1,4,0,2,3,1,2,
        2,1,3,4,2,1,0,2,3,4,2,3,1,
        1,3,2,0,4,3,2,1,3,2,4,3,2,
        0,1,2,3,2,4,3,2,4,3,2,4,3,
        2,3,4,2,3,4,3,4,2,3,4,3,4
      ];
      var frag = document.createDocumentFragment();
      seed.forEach(function (lvl) {
        var cell = document.createElement('span');
        cell.className = 'hm-cell' + (lvl > 0 ? ' l' + lvl : '');
        frag.appendChild(cell);
      });
      grid.appendChild(frag);
    })();

    document.getElementById('helpCenterBtn').addEventListener('click', openQrcodeModal);
    document.getElementById('authLink').addEventListener('click', openQrcodeModal);
  </script>
</body>
</html>
