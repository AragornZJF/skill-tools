<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 · PetPals</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <div class="profile-header">
      <img class="avatar-lg" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&q=80" alt="头像">
      <div class="profile-info">
        <h2 class="text-lg font-bold" style="color:var(--text-main);">猫奴小鱼</h2>
        <p class="text-xs" style="color:var(--text-sub);">ID: 100086 · 上海</p>
        <span class="profile-badge"><i class="fa-solid fa-medal"></i> 资深铲屎官</span>
      </div>
    </div>

    <div class="glass-card profile-stats">
      <div class="stat-col"><p class="stat-num">86</p><p class="stat-label">动态</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">1.2k</p><p class="stat-label">粉丝</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">328</p><p class="stat-label">关注</p></div>
    </div>

    <h3 class="section-title">我的宠物</h3>
    <div class="space-y-3">
      <div class="pet-card ripple-btn" data-nav="pet-detail">
        <img class="pet-avatar" src="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=200&q=80" alt="团子">
        <div class="pet-info">
          <p class="pet-name">团子</p>
          <p class="pet-breed">英短蓝猫 · 2岁 · ♂</p>
        </div>
        <div class="text-right">
          <span class="chip"><i class="fa-solid fa-paw"></i> 打卡 7 天</span>
        </div>
      </div>
      <div class="pet-card ripple-btn" data-nav="pet-detail">
        <img class="pet-avatar" src="https://images.unsplash.com/photo-1592194996308-7b43878e84a6?w=200&q=80" alt="雪团">
        <div class="pet-info">
          <p class="pet-name">雪团</p>
          <p class="pet-breed">布偶猫 · 1岁 · ♀</p>
        </div>
        <div class="text-right">
          <span class="chip chip-lavender"><i class="fa-solid fa-paw"></i> 打卡 5 天</span>
        </div>
      </div>
    </div>

    <div class="glass-card mt-4 overflow-hidden">
      <div class="setting-item ripple-btn" id="checkInBtn">
        <i class="fa-solid fa-paw setting-icon" style="background:var(--primary-grad);"></i>
        <span class="flex-1">每日打卡</span>
        <span class="text-xs mr-2" style="color:var(--primary);">已连续 7 天</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-heart setting-icon" style="background:var(--primary);"></i>
        <span class="flex-1">我的收藏</span>
        <span class="text-xs mr-2" style="color:var(--text-sub);">128</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-images setting-icon" style="background:var(--secondary);"></i>
        <span class="flex-1">萌宠相册</span>
        <span class="text-xs mr-2" style="color:var(--text-sub);">256 张</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-trophy setting-icon" style="background:#ffd93d;"></i>
        <span class="flex-1">我的徽章</span>
        <span class="text-xs mr-2" style="color:var(--text-sub);">12 枚</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-gear setting-icon" style="background:var(--text-sub);"></i>
        <span class="flex-1">账户设置</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn" id="helpCenterBtn">
        <i class="fa-solid fa-circle-question setting-icon" style="background:var(--lavender);"></i>
        <span class="flex-1">帮助中心</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn ripple-btn">退出登录</button>

    <div class="text-center mt-4">
      <span id="authLink" class="text-xs" style="color:var(--text-sub);cursor:pointer;">帮助？@Auth 江枫</span>
    </div>
  </main>

  <script src="./shared/common/qrcode-data.js"></script>
  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
    bindLogout();
    bindCheckIn();
    bindPostLikes();
    bindPetDetailEntry();
    bindMsgEntry();

    document.getElementById('helpCenterBtn').addEventListener('click', openQrcodeModal);
    document.getElementById('authLink').addEventListener('click', openQrcodeModal);
  </script>
</body>
</html>
