<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发现 · PetPals</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <div class="search-bar-wrapper">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" placeholder="搜索宠物、品种、话题">
      </div>
    </div>

    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
      <span class="chip" style="white-space:nowrap;cursor:pointer;background:var(--primary-grad);color:#fff;border:none;padding:6px 14px;">全部</span>
      <span class="chip" style="white-space:nowrap;cursor:pointer;padding:6px 14px;">猫咪日常</span>
      <span class="chip chip-blue" style="white-space:nowrap;cursor:pointer;padding:6px 14px;">狗狗遛弯</span>
      <span class="chip chip-mint" style="white-space:nowrap;cursor:pointer;padding:6px 14px;">异宠乐园</span>
      <span class="chip chip-lavender" style="white-space:nowrap;cursor:pointer;padding:6px 14px;">萌宠穿搭</span>
      <span class="chip chip-accent" style="white-space:nowrap;cursor:pointer;padding:6px 14px;">宠物美食</span>
    </div>

    <div class="waterfall mt-3">
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=400&q=80" alt="狗狗">
        <div class="wf-info">
          <p class="wf-title">金毛的微笑能治愈一切</p>
          <p class="wf-desc">阳光下的大金毛太暖了</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 1.2k</div>
        </div>
      </div>
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&q=80" alt="猫咪">
        <div class="wf-info">
          <p class="wf-title">橘猫的日常：吃和睡</p>
          <p class="wf-desc">十橘九胖诚不欺我</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 856</div>
        </div>
      </div>
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=400&q=80" alt="兔子">
        <div class="wf-info">
          <p class="wf-title">我家兔子的草泥时光</p>
          <p class="wf-desc">啃草速度一流</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 432</div>
        </div>
      </div>
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1591946614720-90a587da4a36?w=400&q=80" alt="柯基">
        <div class="wf-info">
          <p class="wf-title">柯基的小短腿跑起来</p>
          <p class="wf-desc">屁股摇摆满分</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 2.1k</div>
        </div>
      </div>
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1574144611937-0df059b5ef3e?w=400&q=80" alt="鹦鹉">
        <div class="wf-info">
          <p class="wf-title">会说话的金刚鹦鹉</p>
          <p class="wf-desc">每天早上叫我起床</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 678</div>
        </div>
      </div>
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400&q=80" alt="猫咪">
        <div class="wf-info">
          <p class="wf-title">布偶猫的眼睛像星辰</p>
          <p class="wf-desc">深海蓝瞳太梦幻</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 3.4k</div>
        </div>
      </div>
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?w=400&q=80" alt="哈士奇">
        <div class="wf-info">
          <p class="wf-title">二哈拆家日常记录</p>
          <p class="wf-desc">沙发又没了...</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 1.8k</div>
        </div>
      </div>
      <div class="wf-card">
        <img src="https://images.unsplash.com/photo-1456926631375-92c8ce872def?w=400&q=80" alt="猫狗">
        <div class="wf-info">
          <p class="wf-title">猫狗双全的人生赢家</p>
          <p class="wf-desc">它们居然成了好朋友</p>
          <div class="wf-stat"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> 5.6k</div>
        </div>
      </div>
    </div>
  </main>

  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
  </script>
</body>
</html>
