<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <div class="profile-header">
      <img class="avatar-lg" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80" alt="头像">
      <div class="profile-info">
        <h2 class="text-lg font-bold" style="color:#1d1d1f;">轻食客小绿</h2>
        <p class="text-xs" style="color:#8e8e93;">ID: 100086</p>
      </div>
    </div>

    <div class="glass-card profile-stats">
      <div class="stat-col"><p class="stat-num">12</p><p class="stat-label">收藏</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">3</p><p class="stat-label">优惠券</p></div>
      <div class="stat-divider"></div>
      <div class="stat-col"><p class="stat-num">¥128</p><p class="stat-label">钱包余额</p></div>
    </div>

    <div class="glass-card mt-4 overflow-hidden">
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-receipt setting-icon" style="background:#06a77d;"></i>
        <span class="flex-1">我的订单</span>
        <span class="text-xs mr-2" style="color:#8e8e93;">全部</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-location-dot setting-icon" style="background:#06a77d;"></i>
        <span class="flex-1">收货地址</span>
        <span class="text-xs mr-2" style="color:#8e8e93;">2 个</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-ticket setting-icon" style="background:#ff9f0a;"></i>
        <span class="flex-1">优惠券</span>
        <span class="text-xs mr-2" style="color:#06a77d;">3 张可用</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn">
        <i class="fa-solid fa-gear setting-icon" style="background:#8e8e93;"></i>
        <span class="flex-1">账户设置</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
      <div class="setting-item ripple-btn" id="helpCenterBtn">
        <i class="fa-solid fa-circle-question setting-icon" style="background:#5856d6;"></i>
        <span class="flex-1">帮助中心</span>
        <i class="fa-solid fa-chevron-right" style="color:#c7c7cc;"></i>
      </div>
    </div>

    <button id="logoutBtn" class="logout-btn ripple-btn">退出登录</button>

    <div class="text-center mt-4">
      <span id="authLink" class="text-xs" style="color:#8e8e93;cursor:pointer;">帮助？@Auth 江枫</span>
    </div>
  </main>

  <script src="./shared/common/qrcode-data.js"></script>
  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
    bindLogout();

    document.getElementById('helpCenterBtn').addEventListener('click', openQrcodeModal);
    document.getElementById('authLink').addEventListener('click', openQrcodeModal);
  </script>
</body>
</html>
