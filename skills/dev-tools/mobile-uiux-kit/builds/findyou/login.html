<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 觅TA FindYou</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content flex flex-col justify-center px-8">
    <div class="text-center mb-10">
      <div class="app-logo">
        <i class="fa-solid fa-heart"></i>
      </div>
      <h1 class="text-2xl font-bold mt-4" style="color:#2D1F2D;">遇见对的人</h1>
      <p class="text-sm mt-1" style="color:#8C7A8A;">登录觅TA，开启你的缘分之旅</p>
    </div>

    <div class="glass-card p-6 space-y-4">
      <div class="input-group">
        <i class="fa-solid fa-user input-icon"></i>
        <input type="text" id="username" placeholder="手机号" class="glass-input">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="password" placeholder="密码" class="glass-input">
      </div>
      <button id="loginBtn" class="primary-btn ripple-btn w-full">登录觅TA</button>
      <p class="text-center text-xs" style="color:#8C7A8A;">还没有账户？<span style="color:#E8709A;">立即注册</span></p>
    </div>

    <div class="social-login">
      <div class="social-btn ripple-btn">
        <i class="fa-brands fa-weixin"></i>
      </div>
      <div class="social-btn ripple-btn">
        <i class="fa-brands fa-apple"></i>
      </div>
      <div class="social-btn ripple-btn">
        <i class="fa-brands fa-weibo"></i>
      </div>
    </div>

    <div class="text-center mt-8">
      <span id="authLink" class="text-xs" style="color:#8C7A8A;cursor:pointer;">帮助？@Auth 江枫</span>
    </div>
  </main>

  <script src="./shared/common/qrcode-data.js"></script>
  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
    bindLogin();

    document.getElementById('authLink').addEventListener('click', openQrcodeModal);
  </script>
</body>
</html>
