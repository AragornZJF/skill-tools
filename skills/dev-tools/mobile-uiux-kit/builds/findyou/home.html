<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缘分广场 · 觅TA FindYou</title>
  <script src="./shared/vendor/tailwindcss.js"></script>
  <script src="./shared/vendor/font-awesome.min.js"></script>
  <link rel="stylesheet" href="./shared/common/styles.css">
</head>
<body class="page-body">
  <header class="status-bar">
    <span class="status-time">9:41</span>
    <span class="status-icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </header>

  <main class="page-content px-5 pb-6">
    <!-- 顶部问候 -->
    <div class="flex items-center justify-between pt-3 pb-4">
      <div>
        <p class="text-xs" style="color:#8C7A8A;">你好，心动的人</p>
        <h1 class="text-xl font-bold" style="color:#2D1F2D;">今天的缘分已就绪</h1>
      </div>
      <img class="avatar-sm" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80" alt="头像">
    </div>

    <!-- 今日缘分 Banner -->
    <div class="fate-banner ripple-btn">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&q=80" alt="今日缘分">
      <div class="fate-badge">匹配度 95%</div>
      <div class="fate-overlay">
        <p class="fate-name">苏晚晴 · 26岁</p>
        <p class="fate-desc">"喜欢猫和日料，希望遇到一个温暖的人"</p>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="glass-card stat-card ripple-btn">
        <i class="fa-solid fa-eye stat-icon"></i>
        <p class="stat-num">12</p>
        <p class="stat-label">今日访客</p>
      </div>
      <div class="glass-card stat-card ripple-btn">
        <i class="fa-solid fa-heart-circle-plus stat-icon"></i>
        <p class="stat-num">3</p>
        <p class="stat-label">新匹配</p>
      </div>
    </div>

    <!-- 谁看过我 -->
    <h3 class="section-title">谁看过我</h3>
    <div class="visitor-scroll">
      <div class="visitor-item">
        <div class="visitor-avatar-wrap">
          <img class="visitor-avatar" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&q=80" alt="头像">
          <span class="visitor-online"></span>
        </div>
        <p class="visitor-name">林小满</p>
      </div>
      <div class="visitor-item">
        <div class="visitor-avatar-wrap">
          <img class="visitor-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&q=80" alt="头像">
          <span class="visitor-online"></span>
        </div>
        <p class="visitor-name">沈墨白</p>
      </div>
      <div class="visitor-item">
        <div class="visitor-avatar-wrap">
          <img class="visitor-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&q=80" alt="头像">
        </div>
        <p class="visitor-name">陆星河</p>
      </div>
      <div class="visitor-item">
        <div class="visitor-avatar-wrap">
          <img class="visitor-avatar" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100&q=80" alt="头像">
          <span class="visitor-online"></span>
        </div>
        <p class="visitor-name">温如也</p>
      </div>
      <div class="visitor-item">
        <div class="visitor-avatar-wrap">
          <img class="visitor-avatar" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80" alt="头像">
        </div>
        <p class="visitor-name">江月明</p>
      </div>
      <div class="visitor-item">
        <div class="visitor-avatar-wrap">
          <img class="visitor-avatar" src="https://images.unsplash.com/photo-1530268729831-4b0b9e170218?w=100&q=80" alt="头像">
          <span class="visitor-online"></span>
        </div>
        <p class="visitor-name">叶知秋</p>
      </div>
    </div>

    <!-- 心动动态 -->
    <h3 class="section-title">心动动态</h3>
    <div class="space-y-3">
      <div class="moment-card ripple-btn">
        <div class="moment-header">
          <img class="moment-avatar" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&q=80" alt="头像">
          <div class="flex-1">
            <p class="moment-name">林小满</p>
            <p class="moment-time">1小时前</p>
          </div>
        </div>
        <p class="moment-text">周末去了新开的咖啡馆，窗边的位置阳光刚刚好。如果有个人一起分享就更好了。</p>
        <img class="moment-img" src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=500&q=80" alt="动态图片">
        <div class="moment-actions">
          <span><i class="fa-regular fa-heart"></i> 32</span>
          <span><i class="fa-regular fa-comment"></i> 8</span>
          <span><i class="fa-regular fa-share-from-square"></i> 分享</span>
        </div>
      </div>

      <div class="moment-card ripple-btn">
        <div class="moment-header">
          <img class="moment-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&q=80" alt="头像">
          <div class="flex-1">
            <p class="moment-name">沈墨白</p>
            <p class="moment-time">3小时前</p>
          </div>
        </div>
        <p class="moment-text">刚跑完五公里，黄昏的城市真的很美。找一个一起运动的人怎么这么难。</p>
        <img class="moment-img" src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=500&q=80" alt="动态图片">
        <div class="moment-actions">
          <span><i class="fa-regular fa-heart"></i> 56</span>
          <span><i class="fa-regular fa-comment"></i> 14</span>
          <span><i class="fa-regular fa-share-from-square"></i> 分享</span>
        </div>
      </div>

      <div class="moment-card ripple-btn">
        <div class="moment-header">
          <img class="moment-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&q=80" alt="头像">
          <div class="flex-1">
            <p class="moment-name">陆星河</p>
            <p class="moment-time">昨天</p>
          </div>
        </div>
        <p class="moment-text">在书店待了一下午，翻到一本很好的诗集。"你是一树一树的花开，是燕在梁间呢喃。"</p>
        <div class="moment-actions">
          <span><i class="fa-regular fa-heart"></i> 41</span>
          <span><i class="fa-regular fa-comment"></i> 7</span>
          <span><i class="fa-regular fa-share-from-square"></i> 分享</span>
        </div>
      </div>
    </div>
  </main>

  <script src="./shared/common/app.js"></script>
  <script>
    enableRipple();
  </script>
</body>
</html>
